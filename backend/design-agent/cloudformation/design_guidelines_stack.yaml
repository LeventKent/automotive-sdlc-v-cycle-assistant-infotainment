AWSTemplateFormatVersion: '2010-09-09'
Description: 'Design Guidelines Stack - S3 bucket and Lambda function for AgentCore Gateway integration'

Parameters:
  BucketNamePrefix:
    Type: String
    Default: 'design-guidelines'
    Description: 'Prefix for the S3 bucket name'

Resources:
  # S3 Bucket to store design guidelines
  DesignGuidelinesS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Purpose
          Value: DesignGuidelines
        - Key: Project
          Value: AutomotiveDesignAgent

  # IAM Role for AgentCore Gateway
  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'DesignGuidelinesGatewayRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DesignGuidelinesGatewayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt DesignGuidelinesLambda.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DesignGuidelinesS3Bucket.Arn
                  - !Sub '${DesignGuidelinesS3Bucket.Arn}/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                  - bedrock:*
                Resource: '*'

  # IAM Role for AgentCore Runtime
  AgentCoreRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'DesignAgentRuntimeRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DesignAgentRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeGateway
                Resource: '*'
              - Effect: Allow
                Action:
                  - sts:GetServiceBearerToken
                Resource: '*'

  # Lambda function to retrieve design guidelines
  DesignGuidelinesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'design-guidelines-retriever-${AWS::Region}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt DesignGuidelinesLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Ref DesignGuidelinesS3Bucket
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from botocore.exceptions import ClientError

          s3_client = boto3.client('s3')

          def lambda_handler(event, context):
              """
              Lambda function to retrieve design guidelines from S3
              """
              print(f"Context: , {context.client_context}")
              print(f"Event: , {event}")

              try:
                  # Extract parameters context and retrieve documents
                  toolName = context.client_context.custom['bedrockAgentCoreToolName']
                  delimiter = "___"
                  if delimiter in toolName:
                      toolName = toolName[toolName.index(delimiter) + len(delimiter):]
                  bucket_name = os.environ['BUCKET_NAME']
                  
                  if toolName == 'get_technical_guidelines':
                      return get_technical_guidelines(bucket_name, event.get('guideline_type', 'general'))
                  elif toolName == 'list_available_guidelines':
                      return list_available_guidelines(bucket_name)
                  elif toolName == 'get_guideline_by_category':
                      return get_guideline_by_category(bucket_name, event.get('category', 'architecture'))
                  else:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'Unknown tool name'})
                      }
              
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def get_technical_guidelines(bucket_name, guideline_type):
              """Get technical design guidelines from S3"""
              try:
                  # Map guideline types to S3 keys
                  guideline_files = {
                      'general': 'technical-design-guidelines.md',
                      'automotive': 'automotive-specific-guidelines.md',
                      'safety': 'safety-guidelines.md',
                      'performance': 'performance-guidelines.md'
                  }
                  
                  file_key = guideline_files.get(guideline_type, 'technical-design-guidelines.md')
                  
                  response = s3_client.get_object(Bucket=bucket_name, Key=file_key)
                  content = response['Body'].read().decode('utf-8')
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'guideline_type': guideline_type,
                          'content': content,
                          'file_key': file_key
                      })
                  }
              
              except ClientError as e:
                  if e.response['Error']['Code'] == 'NoSuchKey':
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': f'Guideline file not found: {file_key}'})
                      }
                  else:
                      raise e

          def list_available_guidelines(bucket_name):
              """List all available guideline files in S3"""
              try:
                  response = s3_client.list_objects_v2(Bucket=bucket_name)
                  
                  if 'Contents' not in response:
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'guidelines': []})
                      }
                  
                  guidelines = []
                  for obj in response['Contents']:
                      if obj['Key'].endswith('.md'):
                          guidelines.append({
                              'file_name': obj['Key'],
                              'size': obj['Size'],
                              'last_modified': obj['LastModified'].isoformat()
                          })
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({'guidelines': guidelines})
                  }
              
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def get_guideline_by_category(bucket_name, category):
              """Get guidelines filtered by category"""
              try:
                  # This is a simplified implementation
                  # In practice, you might have more sophisticated categorization
                  category_files = {
                      'architecture': 'technical-design-guidelines.md',
                      'safety': 'safety-guidelines.md',
                      'performance': 'performance-guidelines.md',
                      'security': 'security-guidelines.md'
                  }
                  
                  file_key = category_files.get(category, 'technical-design-guidelines.md')
                  
                  response = s3_client.get_object(Bucket=bucket_name, Key=file_key)
                  content = response['Body'].read().decode('utf-8')
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'category': category,
                          'content': content,
                          'file_key': file_key
                      })
                  }
              
              except ClientError as e:
                  if e.response['Error']['Code'] == 'NoSuchKey':
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': f'Category guideline not found: {category}'})
                      }
                  else:
                      raise e


  # IAM Role for Lambda function
  DesignGuidelinesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DesignGuidelinesS3Bucket.Arn
                  - !Sub '${DesignGuidelinesS3Bucket.Arn}/*'

  # Custom resource to populate S3 with initial guidelines
  PopulateGuidelinesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'populate-design-guidelines-${AWS::Region}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt PopulateGuidelinesLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          s3_client = boto3.client('s3')
          
          def lambda_handler(event, context):
              try:
                  bucket_name = event['ResourceProperties']['BucketName']
                  
                  if event['RequestType'] == 'Create':
                      # Upload the technical design guidelines
                      guidelines_content = "# Technical Design Guidelines for Automotive Applications\\n\\n" + \
                          "## Overview\\n" + \
                          "This document provides simple guidelines for creating technical design documents that align with automotive safety standards and development best practices.\\n\\n" + \
                          "## Document Structure\\n\\n" + \
                          "### 1. Executive Summary\\n" + \
                          "- **Purpose**: Brief overview of the application and key objectives\\n" + \
                          "- **Key Requirements**: Safety classification, performance targets, platform constraints\\n" + \
                          "- **Project Constraints**: Team size, timeline, budget, testing resources\\n\\n" + \
                          "### 2. Architecture Overview\\n" + \
                          "- **High-Level Diagram**: Visual representation of system components\\n" + \
                          "- **Component Layers**: UI Layer, Business Logic Layer, Data Layer\\n" + \
                          "- **External Interfaces**: APIs, vehicle systems, middleware services\\n\\n" + \
                          "### 3. Component Specifications\\n" + \
                          "Each component should include:\\n" + \
                          "- **Component ID**: Unique identifier\\n" + \
                          "- **Purpose**: What the component does\\n" + \
                          "- **Responsibilities**: Key functions and duties\\n" + \
                          "- **Dependencies**: Other components it relies on\\n" + \
                          "- **Performance Targets**: Response time, memory usage, etc.\\n\\n" + \
                          "### 4. Safety Considerations\\n" + \
                          "For automotive applications, include:\\n" + \
                          "- **ISO 26262 Compliance**: ASIL classification for safety-critical features\\n" + \
                          "- **Failure Modes**: What can go wrong and how to handle it\\n" + \
                          "- **Driver Distraction**: Minimize interactions while driving\\n" + \
                          "- **Error Recovery**: Graceful degradation strategies\\n\\n" + \
                          "### 5. Implementation Guidance\\n" + \
                          "- **Development Phases**: Break work into manageable phases\\n" + \
                          "- **Key Technologies**: Programming languages, frameworks, libraries\\n" + \
                          "- **Build Configuration**: Dependencies and build settings\\n" + \
                          "- **Project Structure**: File organization and naming conventions\\n\\n" + \
                          "## Design Principles\\n\\n" + \
                          "### Safety First\\n" + \
                          "- Classify features by safety impact (ASIL-A through ASIL-D)\\n" + \
                          "- Implement fail-safe mechanisms for critical functions\\n" + \
                          "- Ensure driver attention remains on the road\\n\\n" + \
                          "### Performance Targets\\n" + \
                          "- **App Launch**: < 3 seconds\\n" + \
                          "- **API Response**: < 500ms\\n" + \
                          "- **Memory Usage**: < 50MB\\n" + \
                          "- **UI Responsiveness**: 60 FPS\\n\\n" + \
                          "### Security Requirements\\n" + \
                          "- **Encryption**: TLS 1.2+ for network communication\\n" + \
                          "- **Authentication**: Secure API key management\\n" + \
                          "- **Data Protection**: Encrypt sensitive user data\\n" + \
                          "- **OTA Updates**: Signed packages with rollback protection\\n"
                      
                      s3_client.put_object(
                          Bucket=bucket_name,
                          Key='technical-design-guidelines.md',
                          Body=guidelines_content,
                          ContentType='text/markdown'
                      )
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  PopulateGuidelinesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3WritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${DesignGuidelinesS3Bucket.Arn}/*'

  PopulateGuidelines:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PopulateGuidelinesFunction.Arn
      BucketName: !Ref DesignGuidelinesS3Bucket

Outputs:
  S3BucketName:
    Description: 'Name of the S3 bucket containing design guidelines'
    Value: !Ref DesignGuidelinesS3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  S3BucketArn:
    Description: 'ARN of the S3 bucket containing design guidelines'
    Value: !GetAtt DesignGuidelinesS3Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketArn'

  LambdaFunctionArn:
    Description: 'ARN of the Lambda function for retrieving guidelines'
    Value: !GetAtt DesignGuidelinesLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'

  GatewayRoleArn:
    Description: 'ARN of the IAM role for AgentCore Gateway'
    Value: !GetAtt GatewayAgentCoreRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GatewayRoleArn'

  RuntimeExecutionRoleArn:
    Description: 'ARN of the IAM role for AgentCore Runtime'
    Value: !GetAtt AgentCoreRuntimeExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RuntimeExecutionRoleArn'