AWSTemplateFormatVersion: '2010-09-09'
Description: 'Design Guidelines Stack - S3 bucket and Lambda function for AgentCore Gateway integration'

Parameters:
  BucketNamePrefix:
    Type: String
    Default: 'design-guidelines'
    Description: 'Prefix for the S3 bucket name'

Resources:
  # S3 Bucket to store design guidelines
  DesignGuidelinesS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Purpose
          Value: DesignGuidelines
        - Key: Project
          Value: AutomotiveDesignAgent

  # IAM Role for AgentCore Gateway
  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'DesignGuidelinesGatewayRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DesignGuidelinesGatewayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt DesignGuidelinesLambda.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DesignGuidelinesS3Bucket.Arn
                  - !Sub '${DesignGuidelinesS3Bucket.Arn}/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                  - bedrock:*
                Resource: '*'

  # IAM Role for AgentCore Runtime
  AgentCoreRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'DesignAgentRuntimeRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DesignAgentRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeGateway
                Resource: '*'
              - Effect: Allow
                Action:
                  - sts:GetServiceBearerToken
                Resource: '*'

  # Lambda function to retrieve design guidelines
  DesignGuidelinesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'design-guidelines-retriever-${AWS::Region}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt DesignGuidelinesLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Ref DesignGuidelinesS3Bucket
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from botocore.exceptions import ClientError

          s3_client = boto3.client('s3')

          def lambda_handler(event, context):
              """
              Lambda function to retrieve design guidelines from S3
              """
              print(f"Context: , {context.client_context}")
              print(f"Event: , {event}")

              try:
                  # Extract parameters context and retrieve documents
                  toolName = context.client_context.custom['bedrockAgentCoreToolName']
                  delimiter = "___"
                  if delimiter in toolName:
                      toolName = toolName[toolName.index(delimiter) + len(delimiter):]
                  bucket_name = os.environ['BUCKET_NAME']
                  
                  if toolName == 'get_technical_guideline':
                      return get_technical_guideline(bucket_name)
                  elif toolName == 'list_available_guidelines':
                      return list_available_guidelines(bucket_name)
                  else:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'Unknown tool name'})
                      }
              
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def get_technical_guideline(bucket_name, guideline_type=None):
              """Get technical design guidelines from S3"""
              try:
                  # Default to general guidelines if no type specified
                  file_key = 'technical-design-guidelines.md'
                  
                  response = s3_client.get_object(Bucket=bucket_name, Key=file_key)
                  content = response['Body'].read().decode('utf-8')
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'content': content,
                          'file_key': file_key
                      })
                  }
              
              except ClientError as e:
                  if e.response['Error']['Code'] == 'NoSuchKey':
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': f'Guideline file not found: {file_key}'})
                      }
                  else:
                      raise e

          def list_available_guidelines(bucket_name):
              """List all available guideline files in S3"""
              try:
                  response = s3_client.list_objects_v2(Bucket=bucket_name)
                  
                  if 'Contents' not in response:
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'guidelines': []})
                      }
                  
                  guidelines = []
                  for obj in response['Contents']:
                      if obj['Key'].endswith('.md'):
                          guidelines.append({
                              'file_name': obj['Key'],
                              'size': obj['Size'],
                              'last_modified': obj['LastModified'].isoformat()
                          })
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({'guidelines': guidelines})
                  }
              
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }



  # IAM Role for Lambda function
  DesignGuidelinesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DesignGuidelinesS3Bucket.Arn
                  - !Sub '${DesignGuidelinesS3Bucket.Arn}/*'

Outputs:
  S3BucketName:
    Description: 'Name of the S3 bucket containing design guidelines'
    Value: !Ref DesignGuidelinesS3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  S3BucketArn:
    Description: 'ARN of the S3 bucket containing design guidelines'
    Value: !GetAtt DesignGuidelinesS3Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketArn'

  LambdaFunctionArn:
    Description: 'ARN of the Lambda function for retrieving guidelines'
    Value: !GetAtt DesignGuidelinesLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'

  GatewayRoleArn:
    Description: 'ARN of the IAM role for AgentCore Gateway'
    Value: !GetAtt GatewayAgentCoreRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GatewayRoleArn'

  RuntimeExecutionRoleArn:
    Description: 'ARN of the IAM role for AgentCore Runtime'
    Value: !GetAtt AgentCoreRuntimeExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RuntimeExecutionRoleArn'